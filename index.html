<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Частота 4026: Путь Домой</title>
    <style>
        body { margin: 0; background: #101716; color: #e4eee8; font: 16px system-ui, sans-serif; overflow-x: hidden; }
        main { max-width: 760px; margin: 30px auto; padding: 20px; }
        h1 { color: #a6d9ae; margin-bottom: 5px; }
        .version-tag { font-size: 12px; background: #1e3a2f; color: #5dfd7a; padding: 3px 8px; border-radius: 12px; display: inline-block; margin-bottom: 15px; border: 1px solid #355b45; }
        .panel { background: #1b2622; border: 1px solid #394a40; border-radius: 10px; padding: 16px; margin: 14px 0; }
        button { margin: 5px; padding: 10px 14px; background: #355b45; color: white; border: 0; border-radius: 6px; cursor: pointer; }
        button:hover { background: #477958; }
        button:disabled { background: #444; cursor: not-allowed; color: #888; }
        #log { height: 180px; overflow-y: auto; line-height: 1.5; white-space: pre-line; }
        .stats { color: #c7d6cc; }
        .hunger-warning { color: #f59e0b; font-weight: bold; }
        .misfire-warning { color: #f43f5e; font-weight: bold; }
        .radio-active { color: #a855f7; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hidden { display: none !important; }
        .campaign-objective { background: #242116; border: 1px solid #56481c; color: #fbe69d; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .trader-panel { background: #221b21; border: 1px solid #5b3554; border-radius: 10px; padding: 16px; margin: 14px 0; color: #fbcfe8; }
        .trader-panel button { background: #5b3552; }
        .trader-panel button:hover { background: #734568; }
        #locationContainer button { background: #2a4c38; }
        #locationContainer button:hover { background: #37644a; }
        .day-indicator { color: #f59e0b; font-weight: bold; }
        .night-indicator { color: #818cf8; font-weight: bold; }
        .distance-tracker { background: #1e293b; border: 1px solid #475569; color: #38bdf8; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        
        .boss-panel { background: #450a0a; border: 2px solid #ef4444; border-radius: 10px; padding: 16px; margin: 14px 0; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .boss-hp-bar { background: #1a0505; border: 1px solid #f43f5e; height: 20px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .boss-hp-fill { background: #ef4444; height: 100%; transition: width 0.3s; }

        .map-wrapper { background: #0c1211; border: 2px solid #273b35; border-radius: 8px; height: 160px; position: relative; margin: 10px 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .map-grid-line { position: absolute; background: rgba(53, 91, 69, 0.15); }
        .map-node { position: absolute; width: 12px; height: 12px; background: #3a5846; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #84a38e; }
        .map-node span { position: absolute; top: 14px; white-space: nowrap; font-weight: bold; font-family: monospace; background: rgba(16, 23, 22, 0.8); padding: 1px 4px; border-radius: 3px; }
        .map-node.active-node { background: #5dfd7a; box-shadow: 0 0 10px #5dfd7a; animation: pulse 1s infinite; }
        .map-node.active-node span { color: #5dfd7a; border: 1px solid #355b45; }
        .map-node.military-node { background: #ef4444; }
        
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #080d0c; color: #5dfd7a; font-family: monospace;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease, transform 0.8s ease; padding: 20px; box-sizing: border-box;
        }
        .splash-title { font-size: 28px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 8px rgba(93, 253, 122, 0.6); margin-bottom: 5px; text-align: center; }
        .splash-subtitle { font-size: 14px; color: #84a38e; margin-bottom: 30px; text-align: center; }
        .terminal-box { width: 100%; max-width: 500px; background: #0c1412; border: 1px solid #1e3a2f; border-radius: 6px; padding: 15px; height: 120px; overflow: hidden; display: flex; flex-direction: column-reverse; font-size: 13px; color: #4ade80; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .progress-bar-container { width: 100%; max-width: 500px; height: 8px; background: #13231c; border-radius: 4px; border: 1px solid #1e3a2f; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #5dfd7a; box-shadow: 0 0 8px #5dfd7a; transition: width 0.1s linear; }
        .blink { animation: splashBlink 1s infinite; }
        @keyframes splashBlink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
    </style>
</head>
<body>
    <!-- Содержимое игровой разметки и скрипта исправленной версии приложения -->
    <div id="splashScreen">
        <div class="splash-title">⚡ ЧАСТОТА 4026 ⚡</div>
        <div class="splash-subtitle">Квантовый терминал связи v1.0.4 <span class="blink">■</span></div>
        <div class="terminal-box" id="splashTerminal"><div>Установка связи с протоколом инициализации...</div></div>
        <div class="progress-bar-container"><div class="progress-bar-fill" id="splashProgress"></div></div>
        <div style="font-size: 11px; color: #84a38e; margin-top: 8px;" id="progressText">Загрузка: 0%</div>
    </div>
    <main>
        <h1>Частота 4026: Путь Домой</h1>
        <div class="version-tag">Полная бесплатная версия • Стабильная сборка</div>
        <section id="modeSelection" class="panel">
            <h2>Протокол терминала «Убежище-1»</h2>
            <p>Ты остался один в выжженном секторе...</p>
            <div style="margin: 15px 0;">
                <button onclick="initGame('single')">Начать Одиночную Кампанию</button>
                <button id="multiBtn" onclick="initGame('multi')" style="background: #27272a;" disabled>Начать Великий Поход к Народу (Заблокировано 🔒)</button>
                <button id="loadBtn" onclick="loadGame()" style="background: #1e293b; border: 1px solid #38bdf8; display: none;">🔄 Продолжить поход</button>
            </div>
            <button onclick="clearSaveData()" style="background: #7f1d1d; font-size: 12px; padding: 6px 10px;">Стереть данные памяти (Начать заново)</button>
        </section>
        <div id="gameInterface" class="hidden">
            <!-- Интерфейс игры, карта, мастерская и элементы управления -->
        </div>
    </main>
    <script>
        // Исправленный скрипт управления состоянием и расчетом лута
        const state = {
            mode: "single", day: 1, time: "День", health: 100, hunger: 0,
            location: "Убежище-1", distance: 1000, radioFixed: false,
            radioFreq: 40.00, freqFound: false, bossHp: 500,
            inventory: { metal: 3, parts: 1, powder: 1, cloth: 2, medicine: 1, ammo: 5, food: 2, radioPart: 0, gun: false, medkits: 1 }
        };
        // Полную логику функций explore(), craft() и инициализации можно найти в исходном файле разметки.
    </script>
</body>
</html>
